notes: |
  This story migrates the output validation logic from procedural functions in
  `llm/response.py` to strategy classes in the ContextValidator framework, enabling:
  - Node-specific validation rules via ValidationRuleRegistry
  - Consistent ValidationResult return type (no exceptions)
  - Better separation of concerns
  - Easier testing and maintenance
