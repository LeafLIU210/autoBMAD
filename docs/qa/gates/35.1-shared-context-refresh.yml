### Data Flow Fix
**Problem**: IndependentAgent calls update_context tool → Tool writes to SQLite directly → (In-memory state NOT updated) → Node completes, graph.py returns in-memory state → shared_context = OLD value → Next node receives stale shared_context

**Solution**: After node execution, refresh shared_context from DB before returning state:
```python
try:
    latest_state = _refresh_shared_context_from_db(pipeline_id, session_manager, logger)
    if latest_state is not None:
        new_state["shared_context"] = latest_state
except Exception as refresh_error:
    # Fallback to in-memory version
```

### Performance
- Single DB read per node execution
- Target: < 10ms per node (acceptable overhead)

