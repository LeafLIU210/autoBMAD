[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docuswarm"
version = "1.0.0"
description = "Multi-agent document orchestration system with BMAD methodology"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "DocuSwarm Team"},
]
keywords = ["multi-agent", "LangGraph", "BMAD", "document-automation", "AI", "claude-agent-sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.50,<0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.4,<3.0.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "claude-agent-sdk>=0.1.0,<0.2.0",
    "pyyaml==6.0.3",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "rich==14.2.0",
    "click>=8.1.0,<9.0.0",
    "structlog>=24.0.0,<25.0.0",
    "aiofiles>=24.0.0,<26.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
]

[project.scripts]
docuswarm = "autoBMAD.docuswarm.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-timeout>=2.1.0,<3.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "typeguard>=4.0.0,<5.0.0",
    "ruff>=0.5.0,<0.6.0",
    "basedpyright>=1.1.0,<2.0.0",
    "black>=24.0.0,<25.0.0",
    "pre-commit>=3.6.0,<4.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
# P1-3 修复: 添加 basetemp 配置避免临时目录权限问题
addopts = "-ra -q --strict-markers --cov=autoBMAD.docuswarm --cov-report=term-missing --cov-report=html --tb=short --basetemp=.pytest-temp"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "autoBMAD"]
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "agent: marks tests as agent-related tests",
    "pipeline: marks tests as pipeline tests",
    "smoke: marks tests as SDK smoke tests",
    "llm: marks tests that require real LLM API calls",
]

[tool.coverage.run]
source = ["autoBMAD.docuswarm"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B018", "B017"]
"autoBMAD/docuswarm/nodes/dual_agent.py" = ["E402"]
"autoBMAD/docuswarm/storage/checkpoints.py" = ["E402"]
"autoBMAD/docuswarm/storage/files.py" = ["E402"]
"autoBMAD/docuswarm/storage/state_manager.py" = ["E402"]
"autoBMAD/docuswarm/utils/logging.py" = ["E402"]

[tool.basedpyright]
pythonVersion = "3.12.10"
reportMissingImports = false
reportMissingModuleSource = false
reportImplicitRelativeImport = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false
reportAssignmentType = false
reportAny = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnusedCallResult = false
