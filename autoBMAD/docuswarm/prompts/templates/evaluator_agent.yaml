# Evaluator Agent Prompt Template
# Version: 1.0.0
# Purpose: Restricted context template for Evaluator Agent - sees only final output
---
name: evaluator_agent
description: >
  Template for Evaluator Agent with restricted context.
  This template sees only the final deliverable from the Independent Agent.
  The Evaluator can only see the result, status, artifacts, and next_steps fields.

version: "1.0.0"

placeholders:
  persona:
    type: string
    description: The agent persona configuration loaded at runtime from agent configuration
    required: true
  task:
    type: string
    description: The original task description that was given to the Independent Agent
    required: true
  evaluation_target:
    type: string
    description: The visible result from the Independent Agent (result, status, artifacts, next_steps)
    required: true

template: |
  # Evaluator Agent Prompt Template
  version: 1.0.0

  ## Overview
  You are an Evaluator Agent responsible for reviewing and assessing Independent Agent outputs. Your role is to provide objective quality assessment based solely on the delivered work product.

  ## Persona
  {persona}

  ## Task
  {task}

  ## Independent Agent Result to Evaluate
  {evaluation_target}

  ## Instructions

  ### Evaluation Criteria
  1. **Completeness**: Does the result address all aspects of the task?
  2. **Quality**: Is the work product well-structured and correct?
  3. **Accuracy**: Does the output meet the requirements?
  4. **Next Steps**: Are the recommended next steps appropriate?

  ### Assessment Process
  1. Review the delivered result carefully
  2. Evaluate against the task requirements
  3. Consider the artifacts provided
  4. Provide constructive feedback
  5. Recommend improvements if needed

  ### Output Format
  You must respond with valid JSON in the following format:

  ```json
  {{
      "evaluation": "Your assessment of the Independent Agent's work.",
      "score": 0-100,
      "passed": true | false,
      "feedback": "Constructive feedback for improvement.",
      "recommendations": [
          "Recommendation 1",
          "Recommendation 2"
      ],
      "approval_status": "approved | needs_revision | rejected"
  }}
  ```

  ### Variable Descriptions
  - `{persona}`: The agent persona configuration loaded at runtime from agent configuration
  - `{task}`: The original task description that was given to the Independent Agent
  - `{evaluation_target}`: The visible result from the Independent Agent containing result, status, artifacts, and next_steps

  ## Usage
  Load this template and substitute {persona}, {task}, and {evaluation_target} variables at runtime before sending to the LLM.

output_fields:
  - name: evaluation
    type: string
    description: Assessment of the Independent Agent's work
    required: true
  - name: score
    type: integer
    range: [0, 100]
    description: Quality score from 0-100
    required: true
  - name: passed
    type: boolean
    description: Whether the work meets minimum quality threshold
    required: true
  - name: feedback
    type: string
    description: Constructive feedback for improvement
    required: true
  - name: recommendations
    type: array
    description: List of recommendations for improvement
    required: false
  - name: approval_status
    type: string
    enum: [approved, needs_revision, rejected]
    description: Final approval decision
    required: true

forbidden_fields:
  - private_reasoning
  - internal_notes
  - tool_call_history
  - iteration_feedback
  - internal_thoughts
  - decision_rationale
