# Analyst 节点文档模板配置
version: "1.0"
node_id: analyst
description: "Templates for Analyst node deliverables"

templates:
  - template_id: requirements_analysis
    title: "Requirements Analysis Report"
    filename_pattern: "requirements-analysis-report.md"
    description: "Comprehensive requirements analysis and context clarification"
    sections:
      - heading: "Objective and Scope"
        required: true
        description: "Clear statement of business objectives and defined scope boundaries"
      - heading: "Stakeholders and Users"
        required: true
        description: "Primary stakeholders, end users, and their needs"
      - heading: "Functional Requirements"
        required: true
        description: "Detailed functional requirements with prioritization"
      - heading: "Non-Functional Constraints"
        required: true
        description: "Performance, security, compatibility, and other constraints"
      - heading: "Acceptance Criteria"
        required: true
        description: "Specific, measurable criteria for validating each requirement"
      - heading: "Pipeline Validation Risks"
        required: true
        description: "Risks that could affect downstream nodes or pipeline execution"
      - heading: "Downstream Guidance"
        required: true
        description: "Recommendations and context for PM, UX, Architect nodes"

  - template_id: user_personas
    title: "User Persona Analysis"
    filename_pattern: "user-personas.md"
    description: "Detailed user persona definitions"
    sections:
      - heading: "Overview"
        required: true
      - heading: "Primary Personas"
        required: true
      - heading: "Secondary Personas"
        required: false
      - heading: "User Journey Maps"
        required: true
        note: "Use Mermaid sequence diagrams"

  - template_id: risk_assessment
    title: "Risk Assessment Report"
    filename_pattern: "risk-assessment.md"
    description: "Project risk identification and mitigation"
    sections:
      - heading: "Risk Overview"
        required: true
      - heading: "Technical Risks"
        required: true
      - heading: "Business Risks"
        required: true
      - heading: "Mitigation Strategies"
        required: true

# 文档标准引用
standards:
  style_guide: "_bmad/_memory/tech-writer-sidecar/documentation-standards.md"
  diagram_format: "mermaid"
  no_time_estimates: true
  commonmark_strict: true
