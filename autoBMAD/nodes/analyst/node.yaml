# Analyst Node Configuration - Story 3.2, 3.8
# This file contains the node-specific configuration for the Analyst pipeline node

node_id: analyst
name: Analyst
description: Data Analyst & Business Intelligence Specialist - transforms raw data into actionable business insights
sequence: 1
deliverable_type: analyst-report
deliverable:
  required_sections:
    - executive_summary
    - data_sources
    - analysis_methodology
    - findings
    - recommendations
    - limitations
agent:
  type: independent
  model: sonnet
  temperature: 0.7
questions:
  - id: q1
    text: "What is the business context and objectives for this analysis?"
    required: true
  - id: q2
    text: "What data sources are available for this analysis?"
    required: true
  - id: q3
    text: "What specific questions should the analysis answer?"
    required: true
dependencies: []
