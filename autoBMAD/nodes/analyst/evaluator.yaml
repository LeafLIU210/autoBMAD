# Analyst Node Evaluation Criteria - Story 2.8
# Universal criteria: completeness, clarity, consistency, actionability, evidence_quality
# Analyst focus: requirement_alignment (0.30), traceability (0.25)

criteria:
  - name: requirement_alignment
    description: "Degree to which documented requirements align with the stated business objectives and scope"
    weight: 0.30
  - name: traceability
    description: "Clear linkage between requirements, acceptance criteria, and downstream guidance"
    weight: 0.25
  - name: scope_control
    description: "Effectiveness in defining boundaries and identifying out-of-scope items"
    weight: 0.20
  - name: downstream_usefulness
    description: "Quality of guidance provided to subsequent pipeline nodes (PM, UX, Architect)"
    weight: 0.15
  - name: clarity
    description: "Clear and unambiguous communication of requirements and acceptance criteria"
    weight: 0.10

thresholds:
  approval: 0.70
  escalation: 0.50
max_iterations: 3
