# UX Node Evaluation Criteria - Story 2.8
# Universal criteria: completeness, clarity, consistency, actionability, evidence_quality
# UX focus: actionability (0.40), clarity (0.30)

criteria:
  - name: actionability
    description: "Degree to which designs can be directly implemented by developers"
    weight: 0.40
  - name: clarity
    description: "Clear communication of user flows, interactions, and design decisions"
    weight: 0.30
  - name: completeness
    description: "Extent to which all user scenarios and edge cases are covered"
    weight: 0.15
  - name: consistency
    description: "Consistent design patterns and interaction behaviors"
    weight: 0.10
  - name: evidence_quality
    description: "Quality of user research and design rationale"
    weight: 0.05

thresholds:
  approval: 0.70
  escalation: 0.50
