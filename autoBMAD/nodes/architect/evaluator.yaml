# Architect Node Evaluation Criteria - Story 2.8
# Universal criteria: completeness, clarity, consistency, actionability, evidence_quality
# Architect focus: completeness (0.35), consistency (0.30)

criteria:
  - name: completeness
    description: "Extent to which all technical requirements and constraints are addressed"
    weight: 0.35
  - name: consistency
    description: "Logical coherence and alignment across all architectural components"
    weight: 0.30
  - name: actionability
    description: "Degree to which architecture can be directly implemented"
    weight: 0.20
  - name: clarity
    description: "Clear communication of technical decisions and trade-offs"
    weight: 0.10
  - name: evidence_quality
    description: "Quality of technical rationale and design justification"
    weight: 0.05

thresholds:
  approval: 0.70
  escalation: 0.50
